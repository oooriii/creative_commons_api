services:
  cc-mock:
    build:
      context: ./cc-mock
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
      - dspace-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  dspace:
    # ... la teva config de DSpace
    environment:
      - cc__P__api__P__rooturl=http://cc-mock:5000
    depends_on:
      cc-mock:
        condition: service_healthy